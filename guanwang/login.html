<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#5b46f5" />
  <title>登录 - 讯连宝 VPN</title>
  <link rel="icon" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body data-page="login" data-title-zh="登录 - 讯连宝 VPN" data-title-en="Sign in - 讯连宝 VPN">
  <div id="site-header"></div>
  <main id="main">
    <section class="auth">
      <aside class="auth-aside">
        <h1 data-zh="回来就能连" data-en="Sign in and connect">回来就能连</h1>
        <p class="lede" data-zh="用户名和密码即可注册，不需要实名，也不需要微信或手机授权。" data-en="Register with a username and password. No identity check, WeChat, or phone authorization.">用户名和密码即可注册，不需要实名，也不需要微信或手机授权。</p>
        <ul>
          <li data-zh="套餐在 App 内通过四方支付购买" data-en="Plans are bought in the app">套餐在 App 内通过四方支付购买</li>
          <li data-zh="到期流量清零，不结转" data-en="Traffic clears at expiry">到期流量清零，不结转</li>
          <li data-zh="绑定邮箱后可以找回账号和重置密码" data-en="Bind an email to recover the account">绑定邮箱后可以找回账号和重置密码</li>
        </ul>
      </aside>
      <div class="auth-main">
        <div class="auth-card">
          <div class="tabs">
            <button type="button" data-action="auth-tab" data-tab="login" class="is-active" data-zh="登录" data-en="Sign in">登录</button>
            <button type="button" data-action="auth-tab" data-tab="register" data-zh="注册" data-en="Register">注册</button>
          </div>
          <form class="form" id="form-login">
            <div id="panel-login">
              <div id="login-alert" class="form-alert" hidden></div>
              <label class="field"><span data-zh="用户名" data-en="Username">用户名</span><input name="username" autocomplete="username" required /></label>
              <div class="field">
                <span data-zh="密码" data-en="Password">密码</span>
                <div class="pw">
                  <input id="login-password" name="password" type="password" autocomplete="current-password" required />
                  <button type="button" data-action="toggle-password" data-target="login-password" data-zh="显示" data-en="Show">显示</button>
                </div>
              </div>
              <button class="btn btn-primary btn-block" type="submit" data-zh="登录" data-en="Sign in">登录</button>
              <p class="fine-note"><button class="btn btn-line" type="button" data-action="auth-tab" data-tab="recover" data-zh="找回账号" data-en="Recover account">找回账号</button></p>
            </div>
          </form>
          <form class="form" id="form-register">
            <div id="panel-register" hidden>
              <div id="reg-alert" class="form-alert" hidden></div>
              <label class="field"><span data-zh="用户名" data-en="Username">用户名</span><input name="username" autocomplete="username" required /></label>
              <label class="field"><span data-zh="邀请码（选填）" data-en="Invite code (optional)">邀请码（选填）</span><input name="invite" autocomplete="off" /></label>
              <div class="field">
                <span data-zh="密码" data-en="Password">密码</span>
                <div class="pw">
                  <input id="reg-password" name="password" type="password" autocomplete="new-password" required />
                  <button type="button" data-action="toggle-password" data-target="reg-password" data-zh="显示" data-en="Show">显示</button>
                </div>
              </div>
              <label class="field"><span data-zh="再输入一次" data-en="Repeat password">再输入一次</span><input name="confirm" type="password" autocomplete="new-password" required /></label>
              <label class="check"><input name="agree" type="checkbox" /> <span><span data-zh="我已阅读并同意" data-en="I have read and agree to the">我已阅读并同意</span> <a href="legal.html?doc=agreement" data-zh="注册协议" data-en="registration agreement">注册协议</a></span></label>
              <button class="btn btn-primary btn-block" type="submit" data-zh="注册" data-en="Register">注册</button>
            </div>
          </form>
          <form class="form" id="form-recover">
            <div id="panel-recover" hidden>
              <div id="recover-alert" class="form-alert" hidden></div>
              <label class="field"><span data-zh="绑定邮箱" data-en="Bound email">绑定邮箱</span><input name="email" type="email" required /></label>
              <label class="field"><span data-zh="验证码" data-en="Code">验证码</span><input name="code" required /></label>
              <label class="field"><span data-zh="新密码" data-en="New password">新密码</span><input name="password" type="password" minlength="8" /></label>
              <button class="btn btn-line btn-block" type="button" data-action="send-recover" data-scene="find_account" data-zh="发送找回验证码" data-en="Send recovery code">发送找回验证码</button>
              <button class="btn btn-line btn-block" type="button" data-action="send-recover" data-scene="reset_password" data-zh="发送重置验证码" data-en="Send reset code">发送重置验证码</button>
              <button class="btn btn-primary btn-block" type="submit" data-zh="查看账号" data-en="Find account">查看账号</button>
              <button class="btn btn-line btn-block" type="button" data-action="reset-password" data-zh="重置密码" data-en="Reset password">重置密码</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/content.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
